name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation
        shell: bash
    env:
      RAGAS_DO_NOT_TRACK: "true"
      LANGCHAIN_TRACING_V2: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            automation/requirements.lock
            automation/requirements-evaluation.lock
            automation/requirements-dev.lock
            automation/pyproject.toml

      - name: Install framework and check dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-evaluation.lock -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
          node --version
          mkdir -p reports/ci

      - name: Check Python with Ruff
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check src tests --config pyproject.toml --output-format concise | tee reports/ci/ruff.txt

      - name: Run unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest tests/unit -v --junitxml=reports/ci/unit-tests.xml | tee reports/ci/pytest.txt

      - name: Save check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-check-reports
          path: automation/reports/ci/
          if-no-files-found: warn
          retention-days: 14
