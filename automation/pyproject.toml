[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingllm-qa-lab"
version = "0.1.0"
description = "Automation framework for testing a local LLM and RAG application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest==9.1.1",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "yapf==0.43.0", "isort==9.0.2", "coverage==7.16.2"]
ui = ["pytest-playwright==0.9.0", "playwright==1.63.0"]
reporting = ["allure-pytest==2.16.2"]
evaluation = [
    "ragas==0.4.3",
    "pydantic==2.13.5",
    # RAGAS 0.4.3 imports legacy VertexAI modules removed in Community 0.4.
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "langchain==0.3.30",
    "langchain-core==0.3.86",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_testkit*", "test_support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "conversation: opt-in greetings, small talk and mixed policy requests in Chat mode",
    "iq: inexpensive educational installation checks",
    "bias: opt-in paired employee-descriptor acceptance checks",
    "performance: opt-in bounded latency and concurrency batches",
    "adversarial: opt-in policy injection and unsupported-fact acceptance scenarios",
    "prompt_regression: opt-in comparison of versioned prompts against golden expectations",
    "golden: explicitly enabled source-bound policy acceptance dataset",
    "ui: explicitly enabled browser checks against a temporary indexed workspace",
    "browser: explicitly enabled offline Page Object checks without application or model calls",
    "smoke: checks that the local application is reachable",
    "api: checks the AnythingLLM developer API",
    "unit: checks framework behavior without a running application",
    "rag: checks generated answers and supporting document sources",
    "quality: combines saved answer checks and existing faithfulness evidence without model calls",
    "live_quality: explicitly enabled single-model RAG-to-Allure scenario with data cleanup",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "COM819"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
split_before_first_argument = true
split_before_named_assigns = false
split_arguments_when_comma_terminated = false
disable_ending_comma_heuristic = true
dedent_closing_brackets = false
indent_closing_brackets = false
split_before_closing_bracket = false
coalesce_brackets = true
continuation_align_style = "FIXED"
continuation_indent_width = 8
blank_line_before_nested_class_or_def = false

[tool.isort]
line_length = 120
multi_line_output = 4
indent = "        "
include_trailing_comma = false
use_parentheses = true
known_first_party = ["llm_testkit", "test_support"]

[tool.coverage.run]
branch = true
source = ["llm_testkit", "test_support.fixtures", "test_support.assertions"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2
